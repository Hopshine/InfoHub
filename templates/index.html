<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfoHub - 微信公众号信息收集与分析系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/trending.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>📊 InfoHub</h1>
            <p class="subtitle">微信公众号信息收集与分析系统</p>
        </header>

        <!-- 统计卡片 -->
        <div class="stats-container">
            <div class="stat-card">
                <div class="stat-icon">📚</div>
                <div class="stat-content">
                    <div class="stat-value" id="total-articles">-</div>
                    <div class="stat-label">文章总数</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-content">
                    <div class="stat-value" id="analyzed-articles">-</div>
                    <div class="stat-label">已分析</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏳</div>
                <div class="stat-content">
                    <div class="stat-value" id="pending-articles">-</div>
                    <div class="stat-label">待分析</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏷️</div>
                <div class="stat-content">
                    <div class="stat-value" id="categories-count">-</div>
                    <div class="stat-label">分类数量</div>
                </div>
            </div>
        </div>

        <!-- 操作按钮 -->
        <div class="actions">
            <button class="btn btn-primary" onclick="refreshData()">
                🔄 刷新数据
            </button>
            <button class="btn btn-warning" onclick="showCollectModal()">
                📥 采集文章
            </button>
            <button class="btn btn-success" onclick="analyzeBatch()">
                🤖 批量分析
            </button>
            <button class="btn btn-info" onclick="showCategories()">
                📊 分类统计
            </button>
            <a href="/trending" class="btn btn-trending" style="background:linear-gradient(135deg,#e53e3e,#805ad5);color:white;text-decoration:none;display:inline-flex;align-items:center;">
                🔥 舆情监控
            </a>
            <button class="btn" style="background:linear-gradient(135deg,#38b2ac,#4299e1);color:white;" onclick="showGenerateModal()">
                ✍️ 生成文章
            </button>
            <button class="btn" style="background:linear-gradient(135deg,#48bb78,#38a169);color:white;" onclick="showPublishModal()">
                📤 发布管理
            </button>
            <button class="btn" style="background:linear-gradient(135deg,#9f7aea,#805ad5);color:white;" onclick="showAccountModal()">
                🏢 公众号管理
            </button>
        </div>

        <!-- 批量操作栏 -->
        <div id="bulk-actions-bar" class="bulk-actions-bar" style="display:none;">
            <div class="bulk-actions-content">
                <span id="selected-count">已选择 0 篇文章</span>
                <div class="bulk-actions-buttons">
                    <button class="btn btn-sm btn-danger" onclick="bulkDelete()">
                        🗑️ 删除选中
                    </button>
                    <button class="btn btn-sm btn-success" onclick="bulkAnalyze()">
                        🤖 分析选中
                    </button>
                    <button class="btn btn-sm" onclick="clearSelection()">
                        取消选择
                    </button>
                </div>
            </div>
        </div>

        <!-- 热点侧边栏 + 文章列表 布局 -->
        <div class="main-layout" style="display:flex;gap:20px;align-items:flex-start;">
            <!-- 文章列表 -->
            <div class="articles-section" style="flex:1;min-width:0;">
            <div class="articles-header">
                <h2>文章列表</h2>
                <div class="select-all-container">
                    <label>
                        <input type="checkbox" id="select-all-checkbox" onchange="toggleSelectAll()">
                        全选
                    </label>
                </div>
            </div>
            <div class="filter-bar">
                <input type="text" id="search-input" placeholder="搜索文章标题..."
                       onkeyup="filterArticles()">
                <select id="category-filter" onchange="filterArticles()">
                    <option value="">全部分类</option>
                </select>
            </div>
            <div id="articles-list" class="articles-list">
                <div class="loading">加载中...</div>
            </div>
            <div class="pagination">
                <button class="btn btn-sm" onclick="prevPage()">上一页</button>
                <span id="page-info">第 1 页</span>
                <button class="btn btn-sm" onclick="nextPage()">下一页</button>
            </div>
        </div>

            <!-- 热点侧边栏 -->
            <div class="trending-sidebar" id="trending-sidebar" style="width:320px;flex-shrink:0;">
                <div class="sidebar-header">
                    <h3>🔥 实时热点</h3>
                    <a href="/trending">查看全部 →</a>
                </div>
                <div class="sidebar-tabs" id="sidebar-tabs">
                    <button class="sidebar-tab active" onclick="switchSidebarTab('weibo')">微博</button>
                    <button class="sidebar-tab" onclick="switchSidebarTab('zhihu')">知乎</button>
                    <button class="sidebar-tab" onclick="switchSidebarTab('baidu')">百度</button>
                    <button class="sidebar-tab" onclick="switchSidebarTab('douyin')">抖音</button>
                </div>
                <div class="sidebar-list" id="sidebar-trending-list">
                    <div class="loading" style="padding:20px;font-size:0.9em;">加载中...</div>
                </div>
                <button class="sidebar-collect-btn" id="sidebar-collect-btn" onclick="collectSidebarPlatform()">📥 采集当前平台热点入库</button>
            </div>
        </div><!-- end main-layout -->

    <!-- 文章详情模态框 -->
    <div id="article-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="article-detail"></div>
        </div>
    </div>

    <!-- 分类统计模态框 -->
    <div id="categories-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeCategoriesModal()">&times;</span>
            <h2>分类统计</h2>
            <div id="categories-chart"></div>
        </div>
    </div>

    <!-- 采集文章模态框 -->
    <div id="collect-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeCollectModal()">&times;</span>
            <h2>📥 采集文章</h2>

            <div class="collect-tabs">
                <button class="tab-btn active" onclick="switchCollectTab('url')">单个URL</button>
                <button class="tab-btn" onclick="switchCollectTab('batch')">批量URL</button>
                <button class="tab-btn" onclick="switchCollectTab('search')">搜索采集</button>
            </div>

            <!-- 单个URL采集 -->
            <div id="collect-url-tab" class="collect-tab-content active">
                <p class="tab-desc">输入微信文章URL进行采集</p>
                <input type="text" id="single-url-input" class="url-input"
                       placeholder="https://mp.weixin.qq.com/s/xxxxx">
                <button class="btn btn-success" onclick="collectSingleUrl()">
                    开始采集
                </button>
            </div>

            <!-- 批量URL采集 -->
            <div id="collect-batch-tab" class="collect-tab-content">
                <p class="tab-desc">每行一个URL，支持批量采集</p>
                <textarea id="batch-urls-input" class="urls-textarea"
                          placeholder="https://mp.weixin.qq.com/s/xxxxx&#10;https://mp.weixin.qq.com/s/yyyyy&#10;https://mp.weixin.qq.com/s/zzzzz"
                          rows="8"></textarea>
                <button class="btn btn-success" onclick="collectBatchUrls()">
                    批量采集
                </button>
            </div>

            <!-- 搜索采集 -->
            <div id="collect-search-tab" class="collect-tab-content">
                <p class="tab-desc">搜索关键词并采集文章（可能遇到验证码）</p>
                <input type="text" id="search-keyword-input" class="url-input"
                       placeholder="输入搜索关键词，如：热点话题、社会新闻">
                <input type="number" id="search-max-input" class="url-input"
                       placeholder="最多采集数量（建议不超过10）" value="5" min="1" max="20">
                <button class="btn btn-success" onclick="collectFromSearch()">
                    搜索并采集
                </button>
            </div>

            <!-- 采集进度 -->
            <div id="crawl-progress" style="display:none;">
                <div class="progress-header">
                    <span id="progress-step">初始化中...</span>
                    <span id="progress-count">0/0</span>
                </div>
                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar" style="width:0%"></div>
                </div>
                <div id="progress-items" class="progress-items"></div>
                <button id="cancel-crawl-btn" class="btn btn-danger" onclick="cancelCrawl()">取消采集</button>
            </div>

            <div id="collect-result" class="collect-result"></div>
        </div>
    </div>

    <!-- 生成文章模态框 -->
    <div id="generate-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeGenerateModal()">&times;</span>
            <h2>✍️ 生成文章</h2>
            <div style="margin:20px 0;">
                <label>生成数量：<input type="number" id="generate-count" value="5" min="1" max="20" style="width:80px;"></label>
                <label style="margin-left:20px;">风格：
                    <select id="generate-style">
                        <option value="news">资讯速报</option>
                        <option value="comment">热点评论</option>
                        <option value="deep">深度解读</option>
                    </select>
                </label>
            </div>
            <button class="btn btn-success" onclick="generateArticles()">开始生成</button>
            <div id="generate-result" style="margin-top:20px;"></div>
        </div>
    </div>

    <!-- 发布管理模态框 -->
    <div id="publish-modal" class="modal">
        <div class="modal-content" style="max-width:800px;">
            <span class="close" onclick="closePublishModal()">&times;</span>
            <h2>📤 发布管理</h2>
            <div class="publish-tabs">
                <button class="tab-btn active" onclick="switchPublishTab('drafts')">草稿箱</button>
                <button class="tab-btn" onclick="switchPublishTab('published')">发布记录</button>
            </div>
            <div id="publish-drafts-tab" class="publish-tab-content active">
                <div id="drafts-list"></div>
            </div>
            <div id="publish-published-tab" class="publish-tab-content">
                <div id="published-list"></div>
            </div>
        </div>
    </div>

    <!-- 公众号管理模态框 -->
    <div id="account-modal" class="modal">
        <div class="modal-content" style="max-width:900px;">
            <span class="close" onclick="closeAccountModal()">&times;</span>
            <h2>🏢 公众号管理</h2>
            <button class="btn btn-primary" onclick="showAccountForm()" style="margin-bottom:15px;">➕ 添加公众号</button>
            <div id="account-form" style="display:none;background:#f5f5f5;padding:15px;border-radius:8px;margin-bottom:15px;">
                <input type="hidden" id="account-id">
                <input type="text" id="account-name" placeholder="公众号名称" style="width:100%;margin-bottom:10px;">
                <input type="text" id="account-appid" placeholder="AppID" style="width:100%;margin-bottom:10px;">
                <input type="text" id="account-secret" placeholder="AppSecret" style="width:100%;margin-bottom:10px;">
                <input type="text" id="account-keywords" placeholder="选题关键词（逗号分隔）" style="width:100%;margin-bottom:10px;">
                <select id="account-style" style="width:100%;margin-bottom:10px;">
                    <option value="news">资讯速报</option>
                    <option value="comment">热点评论</option>
                    <option value="deep">深度解读</option>
                </select>
                <textarea id="account-prompt" placeholder="自定义prompt（可选）" style="width:100%;height:80px;margin-bottom:10px;"></textarea>
                <button class="btn btn-success" onclick="saveAccount()">保存</button>
                <button class="btn" onclick="hideAccountForm()">取消</button>
            </div>
            <div id="accounts-list"></div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
