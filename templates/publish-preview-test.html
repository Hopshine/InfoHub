<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布预览测试 - InfoHub</title>
    <link rel="stylesheet" href="/static/css/components/publish-preview.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            margin-top: 0;
            color: #333;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        .test-section h2 {
            margin-top: 0;
            font-size: 18px;
            color: #666;
        }
        .test-btn {
            padding: 10px 20px;
            margin-right: 10px;
            background: #07c160;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .test-btn:hover {
            background: #06ae56;
        }
        .test-btn.secondary {
            background: #fff;
            color: #333;
            border: 1px solid #d9d9d9;
        }
        .test-btn.secondary:hover {
            background: #f5f5f5;
        }
        #previewContainer {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9999;
        }
        .info-box {
            padding: 15px;
            background: #e6f7ff;
            border: 1px solid #91d5ff;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .info-box code {
            background: #fff;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>发布预览组件测试</h1>

        <div class="info-box">
            <strong>测试说明：</strong><br>
            1. 点击"打开预览"按钮查看微信样式预览<br>
            2. 测试"保存草稿"和"立即群发"功能<br>
            3. 测试错误处理和重试机制<br>
            4. 后端API: <code>POST /api/collections/&lt;id&gt;/publish</code>
        </div>

        <div class="test-section">
            <h2>测试场景1：正常合集预览</h2>
            <button class="test-btn" onclick="testNormalPreview()">打开预览（3篇文章）</button>
            <button class="test-btn secondary" onclick="testSingleArticle()">打开预览（1篇文章）</button>
        </div>

        <div class="test-section">
            <h2>测试场景2：无合集ID（错误处理）</h2>
            <button class="test-btn" onclick="testNoCollectionId()">测试无ID错误</button>
        </div>

        <div class="test-section">
            <h2>测试场景3：模拟发布失败</h2>
            <button class="test-btn" onclick="testPublishError()">测试发布错误+重试</button>
        </div>
    </div>

    <div id="previewContainer"></div>

    <script src="/static/js/components/publish-preview.js"></script>
    <script>
        // 测试数据
        const mockArticles = [
            {
                title: '2024年AI技术发展趋势深度解析',
                summary: '从GPT-4到多模态大模型，AI技术正在经历前所未有的变革...',
                cover: 'https://picsum.photos/800/400?random=1',
                content: '<p>文章内容...</p>'
            },
            {
                title: '微信公众号运营实战指南',
                summary: '如何通过内容运营提升公众号影响力，实现粉丝增长...',
                cover: 'https://picsum.photos/800/400?random=2',
                content: '<p>文章内容...</p>'
            },
            {
                title: 'Python数据分析入门教程',
                summary: '从零开始学习Pandas、NumPy等数据分析工具...',
                cover: 'https://picsum.photos/800/400?random=3',
                content: '<p>文章内容...</p>'
            }
        ];

        // 测试场景1：正常预览
        function testNormalPreview() {
            PublishPreview.init('previewContainer', 123);
            PublishPreview.setArticles(mockArticles);
        }

        // 测试场景2：单篇文章
        function testSingleArticle() {
            PublishPreview.init('previewContainer', 456);
            PublishPreview.setArticles([mockArticles[0]]);
        }

        // 测试场景3：无合集ID
        function testNoCollectionId() {
            PublishPreview.init('previewContainer', null);
            PublishPreview.setArticles(mockArticles);
        }

        // 测试场景4：模拟发布错误
        function testPublishError() {
            PublishPreview.init('previewContainer', 999);
            PublishPreview.setArticles(mockArticles);
        }
    </script>
</body>
</html>
